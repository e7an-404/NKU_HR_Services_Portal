<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Metallic Rim Gradients -->
    <linearGradient id="chromeMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="75%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Industrial Orange Gradient -->
    <linearGradient id="nkuOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9d00"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="orangeHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Dark Tread Wheel Fill -->
    <radialGradient id="treadDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="70%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>

    <!-- Banner Gradient -->
    <linearGradient id="bannerMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="heavyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Pure White Outer Base Disc -->
  <circle cx="250" cy="250" r="240" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 2. Outer Black Frame Ring -->
  <circle cx="250" cy="250" r="226" fill="#090d16" />

  <!-- 3. Heavy Treaded Tire Wheel Structure -->
  <circle cx="250" cy="250" r="215" fill="url(#treadDark)" stroke="url(#chromeMetal)" stroke-width="16" filter="url(#heavyShadow)"/>

  <!-- Tire Tread Teeth / Notches around outer edge -->
  <g fill="#94a3b8" opacity="0.8">
    <rect x="245" y="22" width="10" height="14" rx="2"/>
    <rect x="245" y="464" width="10" height="14" rx="2"/>
    <rect x="22" y="245" width="14" height="10" rx="2"/>
    <rect x="464" y="245" width="14" height="10" rx="2"/>
    <rect x="88" y="88" width="12" height="12" rx="2" transform="rotate(45 94 94)"/>
    <rect x="396" y="396" width="12" height="12" rx="2" transform="rotate(45 402 402)"/>
    <rect x="396" y="88" width="12" height="12" rx="2" transform="rotate(-45 402 94)"/>
    <rect x="88" y="396" width="12" height="12" rx="2" transform="rotate(-45 94 402)"/>
    <!-- Additional angled treads -->
    <rect x="150" y="45" width="10" height="12" rx="2" transform="rotate(25 155 51)"/>
    <rect x="340" y="45" width="10" height="12" rx="2" transform="rotate(-25 345 51)"/>
    <rect x="150" y="443" width="10" height="12" rx="2" transform="rotate(-25 155 449)"/>
    <rect x="340" y="443" width="10" height="12" rx="2" transform="rotate(25 345 449)"/>
  </g>

  <!-- Inner Metallic Bezel Ring -->
  <circle cx="250" cy="250" r="188" fill="none" stroke="url(#nkuOrange)" stroke-width="6"/>
  <circle cx="250" cy="250" r="180" fill="none" stroke="url(#chromeMetal)" stroke-width="3"/>
  <circle cx="250" cy="250" r="172" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- 4. Top Construction Crane Superstructure (Truss & Jib) -->
  <g transform="translate(135, 75)" filter="url(#heavyShadow)">
    <!-- Orange Derrick / Counterweight Truss Structure -->
    <path d="M 10 85 L 115 15 L 220 85 Z" fill="none" stroke="url(#nkuOrange)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M 30 85 L 115 32 L 200 85" fill="none" stroke="url(#nkuOrange)" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Diagonal Lattice Cross Bracing -->
    <line x1="55" y1="85" x2="115" y2="48" stroke="#f97316" stroke-width="5"/>
    <line x1="175" y1="85" x2="115" y2="48" stroke="#f97316" stroke-width="5"/>
    <line x1="10" y1="85" x2="220" y2="85" stroke="url(#nkuOrange)" stroke-width="8"/>

    <!-- Trolley Derrick Cable Mechanism -->
    <rect x="106" y="5" width="18" height="14" fill="#c2410c" rx="2" stroke="#f97316" stroke-width="1.5"/>
    <line x1="115" y1="18" x2="115" y2="85" stroke="#fdba74" stroke-width="3" stroke-dasharray="4,4"/>
  </g>

  <!-- 5. Center Square Box with Thick White X Bracing -->
  <g transform="translate(150, 165)" filter="url(#heavyShadow)">
    <!-- Outer Black Box with Heavy Orange Border Frame -->
    <rect x="0" y="0" width="200" height="135" fill="#090d16" stroke="url(#nkuOrange)" stroke-width="10" rx="6"/>
    <rect x="8" y="8" width="184" height="119" fill="#111827" stroke="#334155" stroke-width="3"/>

    <!-- Thick White 'X' Bracing Lines -->
    <line x1="20" y1="18" x2="180" y2="117" stroke="#ffffff" stroke-width="18" stroke-linecap="square"/>
    <line x1="180" y1="18" x2="20" y2="117" stroke="#ffffff" stroke-width="18" stroke-linecap="square"/>
    
    <!-- Orange Bevel Inner Trim -->
    <rect x="12" y="10" width="176" height="115" fill="none" stroke="#f97316" stroke-width="2"/>
  </g>

  <!-- 6. Heavy Metallic Banner Badge across Lower Section -->
  <g transform="translate(35, 275)" filter="url(#heavyShadow)">
    <!-- Outer Shield Banner Frame with Orange Trim -->
    <path d="M 10 40 L 40 0 L 390 0 L 420 40 L 380 115 L 215 140 L 50 115 Z" fill="url(#bannerMetal)" stroke="url(#nkuOrange)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 22 40 L 48 12 L 382 12 L 408 40 L 372 107 L 215 130 L 58 107 Z" fill="none" stroke="url(#chromeMetal)" stroke-width="3"/>

    <!-- NINDYA KRIDA Text (Bold 3D Metallic White) -->
    <text x="215" y="48" font-family="'Impact', 'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="3">
      NINDYA KRIDA
    </text>
    <text x="215" y="46" font-family="'Impact', 'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3" stroke="#0f172a" stroke-width="2">
      NINDYA KRIDA
    </text>

    <!-- UTAMA Orange Sub-Banner Ribbon -->
    <path d="M 100 62 L 330 62 L 320 102 L 110 102 Z" fill="url(#nkuOrange)" stroke="#7c2d12" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- UTAMA Text inside Orange Ribbon -->
    <text x="215" y="92" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6" stroke="#451a03" stroke-width="2">
      UTAMA
    </text>
  </g>
</svg>
